name = "peerless"
main = "build/index.js"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release"

[cache]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true